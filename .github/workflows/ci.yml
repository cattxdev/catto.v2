name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_call:

jobs:
  lint-typecheck:
    name: Lint, Typecheck & Format
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Check ESM import extensions
        run: pnpm lint:imports

      - name: Run ESLint
        run: pnpm lint

      - name: Run Prettier check
        run: pnpm format:check

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run tests
        run: pnpm test

  build-and-push-bot:
    name: Build & Push Bot Image
    needs: [lint-typecheck, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for bot
        id: meta-bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.tag }}

      - name: Build and push bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-bot.outputs.tags }}
          labels: ${{ steps.meta-bot.outputs.labels }}
          build-args: |
            DEPLOY_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  build-and-push-watermark:
    name: Build & Push Watermark Image
    needs: [lint-typecheck, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for watermark
        id: meta-watermark
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/watermark
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.tag }}

      - name: Build and push watermark image
        uses: docker/build-push-action@v5
        with:
          context: ./services/watermark-rs
          file: ./services/watermark-rs/Dockerfile
          push: true
          tags: ${{ steps.meta-watermark.outputs.tags }}
          labels: ${{ steps.meta-watermark.outputs.labels }}
          cache-from: type=gha,scope=watermark
          cache-to: type=gha,mode=max,scope=watermark

  build-and-push-image-gen:
    name: Build & Push Image Gen Image
    needs: [lint-typecheck, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata for image-gen
        id: meta-image-gen
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/image-gen
          tags: |
            type=raw,value=${{ steps.docker-tag.outputs.tag }}

      - name: Build and push image-gen image
        uses: docker/build-push-action@v5
        with:
          context: ./services/image-gen-rs
          file: ./services/image-gen-rs/Dockerfile
          push: true
          tags: ${{ steps.meta-image-gen.outputs.tags }}
          labels: ${{ steps.meta-image-gen.outputs.labels }}
          cache-from: type=gha,scope=image-gen
          cache-to: type=gha,mode=max,scope=image-gen

  deploy:
    name: Trigger Deployment
    needs: [build-and-push-bot, build-and-push-watermark, build-and-push-image-gen]
    runs-on: ubuntu-latest
    # Deploy if bot & image-gen succeeded; watermark failure is non-blocking
    # (the bot has a Sharp-based watermarking fallback).
    if: |
      always() &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      needs.build-and-push-bot.result == 'success' &&
      needs.build-and-push-image-gen.result == 'success'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    steps:
      - name: Call deploy webhook
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            --fail-with-body \
            --max-time 30 \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}")

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Deployment triggered successfully (HTTP $response)"
          else
            echo "::error::Deployment webhook failed with HTTP $response"
            exit 1
          fi
